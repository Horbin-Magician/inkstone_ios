<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: http: inkstone-attachment:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>富文本编辑</title>
<style>
.ProseMirror {
  position: relative;
}

.ProseMirror {
  word-wrap: break-word;
  white-space: pre-wrap;
  white-space: break-spaces;
  -webkit-font-variant-ligatures: none;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0; /* the above doesn't seem to work in Edge */
}

.ProseMirror pre {
  white-space: pre-wrap;
}

.ProseMirror li {
  position: relative;
}

.ProseMirror-hideselection *::selection { background: transparent; }
.ProseMirror-hideselection *::-moz-selection { background: transparent; }
.ProseMirror-hideselection { caret-color: transparent; }

/* See https://code.haverbeke.berlin/prosemirror/prosemirror/issues/1421#issuecomment-1759320191 */
.ProseMirror [draggable][contenteditable=false] { user-select: text }

.ProseMirror-selectednode {
  outline: 2px solid #8cf;
}

/* Make sure li selections wrap around markers */

li.ProseMirror-selectednode {
  outline: none;
}

li.ProseMirror-selectednode:after {
  content: "";
  position: absolute;
  left: -32px;
  right: -2px; top: -2px; bottom: -2px;
  border: 2px solid #8cf;
  pointer-events: none;
}

/* Protect against generic img rules */

img.ProseMirror-separator {
  display: inline !important;
  border: none !important;
  margin: 0 !important;
}

:root { color-scheme: light dark; --body-size: 17px; --line-spacing: 5px; --accent: #316b62; --background: #fff; --text: #202423; --muted: #6e7572; --line: #dde3df; --panel: #f3f6f3; }
@media (prefers-color-scheme: dark) { :root { --accent: #8bc8b9; --background: #1c1c1e; --text: #eee; --muted: #a5ada8; --line: #3c4440; --panel: #272c29; } }
* { box-sizing: border-box; } body { margin: 0; background: var(--background); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
#toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 5px; overflow-x: auto; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--background); -webkit-overflow-scrolling: touch; }
button { flex: 0 0 auto; min-height: 36px; padding: 6px 11px; border: 0; border-radius: 7px; background: var(--panel); color: var(--text); font: inherit; font-size: 14px; touch-action: manipulation; }
button[aria-pressed=true] { background: var(--accent); color: var(--background); } button:disabled { opacity: .35; } button:focus-visible { outline: 2px solid var(--accent); }
#editor { max-width: 800px; margin: auto; padding: 12px 18px 80px; }
.ProseMirror { outline: none; min-height: 65vh; white-space: pre-wrap; overflow-wrap: break-word; font-size: var(--body-size); line-height: calc(1.5em + var(--line-spacing)); -webkit-text-size-adjust: 100%; }
.ProseMirror p { margin: 0 0 .8em; } .ProseMirror h1 { font-size: 1.9em; } .ProseMirror h2 { font-size: 1.5em; } .ProseMirror h3 { font-size: 1.25em; } .ProseMirror h1, .ProseMirror h2, .ProseMirror h3 { line-height: 1.3; margin: .65em 0 .45em; }
.ProseMirror blockquote { border-left: 3px solid var(--accent); color: var(--muted); margin: 12px 0; padding-left: 14px; }
.ProseMirror ul, .ProseMirror ol { padding-left: 28px; } .ProseMirror li p { margin-bottom: .25em; }
.ProseMirror li.task { position: relative; list-style: none; } .task > input { position: absolute; left: -26px; top: 5px; width: 19px; height: 19px; accent-color: var(--accent); }
.ProseMirror pre { background: var(--panel); padding: 12px; border-radius: 8px; white-space: pre-wrap; } code { font-family: ui-monospace, monospace; font-size: .9em; background: var(--panel); border-radius: 3px; }
.ProseMirror a, .wiki { color: var(--accent); text-decoration: underline; } img { max-width: 100%; height: auto; } hr { border: 0; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; table-layout: fixed; } th, td { border: 1px solid var(--line); padding: 8px; vertical-align: top; position: relative; min-width: 40px; } th { background: var(--panel); } .selectedCell:after { content: ''; position: absolute; inset: 0; background: #78af9c40; pointer-events: none; }
.raw-block { border: 1px dashed var(--line); color: var(--muted); padding: 8px 12px; border-radius: 8px; margin: 10px 0; } .raw-block pre { max-height: 100px; overflow: auto; margin: 6px 0 0; font-size: 12px; } .raw-block small { font-size: 12px; }
.ProseMirror-selectednode { outline: 2px solid var(--accent); } .ProseMirror-hideselection *::selection { background: transparent; }
#status { color: var(--muted); font-size: 13px; padding: 0 16px; } #status:empty { display: none; }
dialog { width: min(90vw, 420px); padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--background); color: var(--text); } dialog::backdrop { background: #0005; } dialog h2 { margin-top: 0; font-size: 20px; } label { display: block; margin: 12px 0; font-size: 14px; } input[type=text] { display: block; margin-top: 6px; padding: 10px; width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; } #link-error { font-size: 12px; color: #bb4040; }
</style></head><body>
<div id="toolbar" role="toolbar" aria-label="文字格式"></div><div id="status" role="status"></div><main id="editor"></main>
<dialog id="link-dialog"><form id="link-form"><h2>插入链接</h2><label>地址或 [[笔记路径]]<input id="link-url" type="text" autocomplete="off" list="note-targets" required><datalist id="note-targets"></datalist></label><label>显示文字<input id="link-label" type="text"></label><p id="link-error"></p><button type="button" id="cancel-link">取消</button> <button type="submit">确定</button></form></dialog>
<script src="editor.js"></script></body></html>
